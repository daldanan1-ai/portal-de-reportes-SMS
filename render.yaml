# Portal público de reportes SMS en Render (sitio estático: gratis, no se duerme).
# Llama al backend y al chatbot de Atalaya, también en Render.
services:
  - type: web
    name: atalaya-portal-reportes
    runtime: static
    buildCommand: echo "sin build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Mismas cabeceras que nginx.conf.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://atalaya-backend-p6fi.onrender.com https://atalaya-avi-jquintero.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
